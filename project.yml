name: LoveLetter
options:
  bundleIdPrefix: com.amirhayek
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  defaultConfig: Debug
configs:
  Debug: debug
  Release: release

packages:
  SwiftMail:
    url: https://github.com/Cocoanetics/SwiftMail
    from: 1.0.0
  LoveLetterSDK:
    path: ../LoveLetterSDK
  # In-app updater for the direct-download (non-App Store) Mac build — same as Zcode.
  AppUpdater:
    url: https://github.com/s1ntoneli/AppUpdater
    from: 0.2.0

targets:
  LoveLetter:
    type: application
    platform: [iOS, macOS]
    deploymentTarget:
      iOS: "27.0"
      macOS: "27.0"
    sources:
      - path: LoveLetter
        createIntermediateGroups: true
        excludes:
          - "Resources/Skill/**"
      # Folder reference so the directory structure survives into the bundle. xcodegen gives
      # .md files no build phase by default, so without this the skill silently wouldn't ship.
      - path: LoveLetter/Resources/Skill
        buildPhase: resources
        type: folder
    dependencies:
      - package: SwiftMail
        product: SwiftMail
      - package: LoveLetterSDK
        product: LoveLetterCore
      - package: AppUpdater
        product: AppUpdater
        platforms: [macOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amirhayek.AppFeedback
        # Distribution flavor, surfaced to the app as Info.plist `LLDistributionFlavor`.
        # `appstore` (default) never self-updates; Scripts/release.sh builds the website
        # download with DISTRIBUTION_FLAVOR=direct, which turns on the GitHub-releases updater.
        DISTRIBUTION_FLAVOR: appstore
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LoveLetter/Info.plist
        CODE_SIGN_ENTITLEMENTS: LoveLetter/LoveLetter.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q7U5734Q3T

  LoveLetterTests:
    type: bundle.unit-test
    platform: [iOS, macOS]
    deploymentTarget:
      iOS: "27.0"
      macOS: "27.0"
    sources:
      - path: LoveLetterTests
        createIntermediateGroups: true
    dependencies:
      - target: LoveLetter_iOS
        platforms: [iOS]
      - target: LoveLetter_macOS
        platforms: [macOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amirhayek.AppFeedbackTests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q7U5734Q3T

  # Marketing screenshots on mock data — run via Scripts/screenshots.sh, not part of the unit
  # test schemes (it relaunches the app dozens of times).
  LoveLetterScreenshots:
    type: bundle.ui-testing
    platform: [iOS, macOS]
    deploymentTarget:
      iOS: "27.0"
      macOS: "27.0"
    sources:
      - path: LoveLetterScreenshots
        createIntermediateGroups: true
    dependencies:
      - target: LoveLetter_iOS
        platforms: [iOS]
      - target: LoveLetter_macOS
        platforms: [macOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amirhayek.AppFeedbackScreenshots
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q7U5734Q3T

schemes:
  LoveLetter_iOS:
    build:
      targets:
        LoveLetter_iOS: all
        LoveLetterTests_iOS: [test]
    test:
      targets:
        - LoveLetterTests_iOS
    run:
      config: Debug
    archive:
      config: Release

  LoveLetter_macOS:
    build:
      targets:
        LoveLetter_macOS: all
        LoveLetterTests_macOS: [test]
    test:
      targets:
        - LoveLetterTests_macOS
    run:
      config: Debug
    archive:
      config: Release

  LoveLetterScreenshots_iOS:
    build:
      targets:
        LoveLetter_iOS: all
        LoveLetterScreenshots_iOS: [test]
    test:
      config: Debug
      targets:
        - LoveLetterScreenshots_iOS

  LoveLetterScreenshots_macOS:
    build:
      targets:
        LoveLetter_macOS: all
        LoveLetterScreenshots_macOS: [test]
    test:
      config: Debug
      targets:
        - LoveLetterScreenshots_macOS
