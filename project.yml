name: LoveLetter
options:
  bundleIdPrefix: com.amirhayek
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  defaultConfig: Debug
configs:
  Debug: debug
  Release: release

packages:
  SwiftMail:
    url: https://github.com/Cocoanetics/SwiftMail
    from: 1.0.0
  LoveLetterSDK:
    path: ../LoveLetterSDK

targets:
  LoveLetter:
    type: application
    platform: [iOS, macOS]
    deploymentTarget:
      iOS: "27.0"
      macOS: "27.0"
    sources:
      - path: LoveLetter
        createIntermediateGroups: true
        excludes:
          - "Resources/Skill/**"
      # Folder reference so the directory structure survives into the bundle. xcodegen gives
      # .md files no build phase by default, so without this the skill silently wouldn't ship.
      - path: LoveLetter/Resources/Skill
        buildPhase: resources
        type: folder
    dependencies:
      - package: SwiftMail
        product: SwiftMail
      - package: LoveLetterSDK
        product: LoveLetterCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amirhayek.AppFeedback
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LoveLetter/Info.plist
        CODE_SIGN_ENTITLEMENTS: LoveLetter/LoveLetter.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q7U5734Q3T

  LoveLetterTests:
    type: bundle.unit-test
    platform: [iOS, macOS]
    deploymentTarget:
      iOS: "27.0"
      macOS: "27.0"
    sources:
      - path: LoveLetterTests
        createIntermediateGroups: true
    dependencies:
      - target: LoveLetter_iOS
        platforms: [iOS]
      - target: LoveLetter_macOS
        platforms: [macOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amirhayek.AppFeedbackTests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q7U5734Q3T

schemes:
  LoveLetter_iOS:
    build:
      targets:
        LoveLetter_iOS: all
        LoveLetterTests_iOS: [test]
    test:
      targets:
        - LoveLetterTests_iOS
    run:
      config: Debug
    archive:
      config: Release

  LoveLetter_macOS:
    build:
      targets:
        LoveLetter_macOS: all
        LoveLetterTests_macOS: [test]
    test:
      targets:
        - LoveLetterTests_macOS
    run:
      config: Debug
    archive:
      config: Release
